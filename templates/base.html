<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-100">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Nafila Shop{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@2.0.3"></script>
    <script src="https://unpkg.com/hyperscript.org@0.9.12"></script>
  </head>
  <body class="min-h-full text-slate-900">
    <header class="bg-white shadow">
      <div class="mx-auto flex max-w-6xl items-center justify-between px-4 py-4">
        <a href="{% url 'interactions:home' %}" class="text-2xl font-semibold text-indigo-600">Nafila Shop</a>
        <nav class="flex items-center gap-4 text-sm font-medium">
          <a href="{% url 'idea-list' %}" class="text-slate-700 hover:text-indigo-600">Ideas</a>
          {% if user.is_authenticated %}
          <a href="{% url 'dashboard' %}" class="text-slate-700 hover:text-indigo-600">Dashboard</a>
          <a href="{% url 'profile' %}" class="text-slate-700 hover:text-indigo-600">Profile</a>
          <form action="{% url 'logout' %}" method="post" class="inline">
            {% csrf_token %}
            <button class="rounded bg-indigo-600 px-3 py-1.5 text-white hover:bg-indigo-500">Logout</button>
          </form>
          {% else %}
          <a href="{% url 'login' %}" class="text-slate-700 hover:text-indigo-600">Login</a>
          <a href="{% url 'register' %}" class="rounded bg-indigo-600 px-3 py-1.5 text-white hover:bg-indigo-500">Sign Up</a>
          {% endif %}
        </nav>
      </div>
    </header>

    <main class="mx-auto max-w-6xl px-4 py-8">
      {% for message in messages %}
      <div class="mb-4 rounded border-l-4 border-indigo-500 bg-white p-4 shadow">
        <p class="text-sm text-slate-700">{{ message }}</p>
      </div>
      {% endfor %}
      {% block content %}{% endblock %}
    </main>

    <footer class="mt-12 bg-white py-8 text-center text-sm text-slate-500">
      <p>&copy; {% now "Y" %} Nafila Shop. Empowering entrepreneurs & investors.</p>
    </footer>
  </body>
</html>
